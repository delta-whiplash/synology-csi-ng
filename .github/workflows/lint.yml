name: Lint

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.14.4

      - name: helm lint
        run: helm lint charts/synology-csi-ng --strict

      - name: helm template (default profile)
        run: |
          # Default profile: empty iscsiadmPath, chrootDir=/host (kubeadm-style).
          helm template test charts/synology-csi-ng \
            --set storageClasses.iscsi-delete.reclaimPolicy=Delete \
            --set storageClasses.iscsi-delete.parameters.fsType=xfs \
            --set storageClasses.iscsi-delete.parameters.location=/volume2 \
            > /tmp/render-default.yaml
          test -s /tmp/render-default.yaml

      - name: helm template (Talos profile)
        run: |
          helm template test charts/synology-csi-ng \
            --set hostTools.iscsiadmPath=/usr/local/sbin/iscsiadm \
            --set storageClasses.iscsi-delete.reclaimPolicy=Delete \
            --set storageClasses.iscsi-delete.parameters.fsType=xfs \
            --set storageClasses.iscsi-delete.parameters.location=/volume2 \
            > /tmp/render-talos.yaml
          test -s /tmp/render-talos.yaml

      - name: kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          # Snapshot.storage.k8s.io CRDs are not in kubeconform's default
          # schema bundle — pull them from the datreeio CRDs-catalog which
          # tracks upstream CRD OpenAPI specs.
          SCHEMA_LOC="-schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'"
          eval ./kubeconform -strict -ignore-missing-schemas -summary \
            $SCHEMA_LOC /tmp/render-default.yaml
          eval ./kubeconform -strict -ignore-missing-schemas -summary \
            $SCHEMA_LOC /tmp/render-talos.yaml

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: markdown links sanity (no dead local refs)
        run: |
          for f in README.md docs/*.md; do
            grep -oE '\]\(([^)h][^)]*)\)' "$f" | sed 's/](\(.*\))/\1/' | while read -r link; do
              target="${link%%#*}"
              [ -e "$target" ] || { echo "broken local link in $f: $link"; exit 1; }
            done
          done

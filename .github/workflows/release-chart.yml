name: Release chart

on:
  push:
    tags:
      - "chart-v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.14.4

      - name: helm lint (gate)
        run: helm lint charts/synology-csi-ng --strict

      - name: Tag/Chart.yaml version consistency (gate)
        run: |
          # The triggering tag MUST be chart-v<Chart.yaml version>. A
          # mismatch means someone tagged a release without bumping the
          # chart version (or vice versa) — refuse to publish silently.
          TAG="${GITHUB_REF#refs/tags/chart-v}"
          CHART_VERSION=$(sed -n 's/^version: //p' charts/synology-csi-ng/Chart.yaml)
          echo "tag version:     $TAG"
          echo "Chart.yaml version: $CHART_VERSION"
          if [ "$TAG" != "$CHART_VERSION" ]; then
            echo "::error::tag chart-v${TAG} does not match Chart.yaml version ${CHART_VERSION}"
            exit 1
          fi
          echo "CHART_VERSION=$CHART_VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push to OCI (primary distribution)
        run: |
          VERSION=$(sed -n 's/^version: //p' charts/synology-csi-ng/Chart.yaml)
          helm package charts/synology-csi-ng --version "$VERSION"
          helm push synology-csi-ng-"$VERSION".tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Publish classic HTTPS repo (gh-pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/chart-repo && helm package charts/synology-csi-ng --destination /tmp/chart-repo
          # Pull the existing index so `helm repo index --merge` appends to
          # it rather than replacing it — otherwise every release wipes the
          # history and older chart versions become unreachable.
          #
          # Hard-fail when prior releases exist: if older chart-v* tags are
          # present but the remote index.yaml is unreachable, that is a
          # real problem (data loss in waiting) and must surface as a
          # workflow failure, not a silent fresh index. The || true path
          # is only acceptable on a first-ever release (no prior tags).
          prior_tags=$(git tag -l 'chart-v*' | grep -v "^chart-v${TAG}$" || true)
          if [ -n "$prior_tags" ]; then
            curl -fsSL https://delta-whiplash.github.io/synology-csi-ng/index.yaml -o /tmp/chart-repo/index.yaml
          else
            curl -fsSL https://delta-whiplash.github.io/synology-csi-ng/index.yaml -o /tmp/chart-repo/index.yaml || true
          fi
          helm repo index /tmp/chart-repo --merge /tmp/chart-repo/index.yaml --url https://${{ github.repository_owner }}.github.io/$(basename ${{ github.repository }})
          git fetch origin gh-pages || git checkout --orphan gh-pages
          git checkout gh-pages 2>/dev/null || git checkout -b gh-pages
          cp -f /tmp/chart-repo/*.tgz . 2>/dev/null || true
          cp -f /tmp/chart-repo/index.yaml .
          git add index.yaml *.tgz
          git commit -m "chart release $VERSION" || echo "nothing to commit"
          git push origin gh-pages

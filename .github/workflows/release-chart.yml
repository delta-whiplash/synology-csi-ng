name: Release chart

on:
  push:
    tags:
      - "chart-v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: helm lint (gate)
        run: helm lint charts/synology-csi-talos-ng --strict

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push to OCI (primary distribution)
        run: |
          VERSION=$(sed -n 's/^version: //p' charts/synology-csi-talos-ng/Chart.yaml)
          helm package charts/synology-csi-talos-ng --version "$VERSION"
          helm push synology-csi-talos-ng-"$VERSION".tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Publish classic HTTPS repo (gh-pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/chart-repo && helm package charts/synology-csi-talos-ng --destination /tmp/chart-repo
          helm repo index /tmp/chart-repo --url https://${{ github.repository_owner }}.github.io/$(basename ${{ github.repository }})
          git fetch origin gh-pages || git checkout --orphan gh-pages
          git checkout gh-pages 2>/dev/null || git checkout -b gh-pages
          cp -f /tmp/chart-repo/*.tgz . 2>/dev/null || true
          cp -f /tmp/chart-repo/index.yaml .
          git add index.yaml *.tgz
          git commit -m "chart release $VERSION" || echo "nothing to commit"
          git push origin gh-pages

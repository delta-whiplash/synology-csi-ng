name: Build driver image

# Builds the upstream synology-csi source with images/Dockerfile.alpine,
# applies any project patches under patches/$UPSTREAM_REF_VALIDATED/, and
# publishes to ghcr.io/<owner>/synology-csi. Exists because Synology
# released driver v1.4.0 without publishing an image (their v1.4.0 Dockerfile
# requires RHEL entitlement). Patches are applied on top of the upstream
# checkout so our builds can ship driver fixes (NFS root_squash, 2370 retry…)
# while we wait for upstream PRs to land.
#
# Pipeline:
#   1. build-test  — build amd64 locally (--load), smoke-test the resulting
#                    binary and the host tooling embedded in the image
#                    (mkfs.xfs, nvme-cli), AND run `go test -race`
#                    against the patched source. Gate: anything red blocks
#                    the publish job.
#   2. publish     — multi-arch build+push, cosign keyless signature,
#                    set GHCR visibility to public.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream SynologyOpenSource/synology-csi git ref (tag)"
        required: true
        default: v1.4.0
      image_tag:
        description: "Optional image tag override. When empty, defaults to upstream_ref."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate upstream_ref
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          if ! echo "$UPSTREAM_REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::upstream_ref must match v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "UPSTREAM_REF_VALIDATED=$UPSTREAM_REF" >> "$GITHUB_ENV"

      - name: Resolve image tag
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
          DEFAULT_TAG: ${{ env.UPSTREAM_REF_VALIDATED }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            echo "IMAGE_TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=$DEFAULT_TAG" >> "$GITHUB_ENV"
          fi

      - name: Checkout upstream source at ${{ env.UPSTREAM_REF_VALIDATED }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SynologyOpenSource/synology-csi
          ref: ${{ env.UPSTREAM_REF_VALIDATED }}
          path: upstream

      - name: Apply project patches
        shell: bash
        run: |
          set -euo pipefail
          patch_dir="$GITHUB_WORKSPACE/patches/${UPSTREAM_REF_VALIDATED}"
          if [ ! -d "$patch_dir" ]; then
            echo "No patches directory at $patch_dir — building vanilla upstream."
            exit 0
          fi
          shopt -s nullglob
          patches=("$patch_dir"/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No *.patch files under $patch_dir — building vanilla upstream."
            exit 0
          fi
          echo "Applying ${#patches[@]} patch(es) from $patch_dir to upstream/:"
          for p in "${patches[@]}"; do
            echo "  - $(basename "$p")"
            git -C "$GITHUB_WORKSPACE/upstream" apply "$p"
          done
        env:
          UPSTREAM_REF_VALIDATED: ${{ env.UPSTREAM_REF_VALIDATED }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build amd64 image locally (--load, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: upstream
          file: images/Dockerfile.alpine
          platforms: linux/amd64
          load: true
          tags: synology-csi:smoke-test
          cache-from: type=gha
          provenance: false

      - name: Smoke test — driver binary responds to --help
        run: |
          docker run --rm synology-csi:smoke-test --help

      - name: Smoke test — host tools embedded in runtime image
        run: |
          # The runtime image must ship mkfs.xfs and nvme-cli — the CSI node
          # DaemonSet relies on both at runtime. iscsiadm is intentionally
          # NOT in the image: on Talos the host provides it, bind-mounted
          # into the node container via hostTools.iscsiadmPath.
          docker run --rm --entrypoint /bin/sh synology-csi:smoke-test -c '
            set -eu
            echo "--- mkfs.xfs ---"
            mkfs.xfs -V
            echo "--- nvme ---"
            nvme version || true
            echo "--- iscsiadm (INFO) ---"
            if command -v iscsiadm >/dev/null 2>&1 || [ -x /usr/local/sbin/iscsiadm ]; then
              echo "INFO: iscsiadm present in image"
            else
              echo "INFO: iscsiadm not in image — provided by host on Talos"
            fi
          '

      - name: go test -race on patched source (gate)
        run: |
          # Run the driver test suite inside the same golang image used by
          # the Dockerfile builder stage, so toolchain version matches.
          docker run --rm \
            -v "$GITHUB_WORKSPACE/upstream:/src" \
            -w /src \
            golang:1.25-alpine@sha256:1ae0735f00daffa3aaf1363a5184c0d2dc55c78e3db4ec70241cdac97bf84b59 \
            sh -c 'apk add --no-cache alpine-sdk >/dev/null 2>&1 && go test -race -count=1 -timeout=600s ./pkg/...'

  publish:
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
      id-token: write  # cosign keyless signing requires OIDC token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate upstream_ref
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          if ! echo "$UPSTREAM_REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::upstream_ref must match v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "UPSTREAM_REF_VALIDATED=$UPSTREAM_REF" >> "$GITHUB_ENV"

      - name: Resolve image tag
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
          DEFAULT_TAG: ${{ env.UPSTREAM_REF_VALIDATED }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            echo "IMAGE_TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=$DEFAULT_TAG" >> "$GITHUB_ENV"
          fi

      - name: Checkout upstream source at ${{ env.UPSTREAM_REF_VALIDATED }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SynologyOpenSource/synology-csi
          ref: ${{ env.UPSTREAM_REF_VALIDATED }}
          path: upstream

      - name: Apply project patches
        shell: bash
        run: |
          set -euo pipefail
          patch_dir="$GITHUB_WORKSPACE/patches/${UPSTREAM_REF_VALIDATED}"
          if [ ! -d "$patch_dir" ]; then
            echo "No patches directory at $patch_dir — building vanilla upstream."
            exit 0
          fi
          shopt -s nullglob
          patches=("$patch_dir"/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No *.patch files under $patch_dir — building vanilla upstream."
            exit 0
          fi
          echo "Applying ${#patches[@]} patch(es) from $patch_dir to upstream/:"
          for p in "${patches[@]}"; do
            echo "  - $(basename "$p")"
            git -C "$GITHUB_WORKSPACE/upstream" apply "$p"
          done
        env:
          UPSTREAM_REF_VALIDATED: ${{ env.UPSTREAM_REF_VALIDATED }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: upstream
          file: images/Dockerfile.alpine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/synology-csi:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Cosign sign (keyless)
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/synology-csi:${IMAGE_TAG}"

      - name: Verify published image is pullable (visibility gate)
        run: |
          # New GHCR packages default to private; a CSI driver image is
          # useless to cluster nodes if they cannot pull it anonymously.
          # Two-layer check:
          #   1. anonymous pull = the true node experience. BUT GHCR serves
          #      403 on anonymous /token requests from GitHub runner IPs,
          #      so a failure there is a runner restriction, not proof of
          #      a private package.
          #   2. authenticated pull with GITHUB_TOKEN = proves the tag was
          #      pushed and is servable by the registry.
          # The packages REST API is NOT usable here: /user/packages/* 404s
          # with GITHUB_TOKEN for user-owned packages, and PATCH 404s on
          # already-public packages.
          # If layer 2 passes but layer 1 was blocked and this is a NEW
          # package name, visibility must be flipped once manually; later
          # tags inherit the package visibility.
          IMAGE="delta-whiplash/synology-csi"
          ACCEPT="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"

          pull_code() {  # $1 = auth mode (anon|auth); echoes manifest HTTP code
            local user_arg=()
            if [ "$1" = "auth" ]; then
              TOKEN=$(curl -s -u "${GITHUB_REPOSITORY_OWNER}:${GITHUB_TOKEN}" \
                "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMAGE}:pull" | jq -r '.token // empty')
            else
              TOKEN=$(curl -s \
                "https://ghcr.io/token?scope=repository:${IMAGE}:pull" | jq -r '.token // empty')
            fi
            [ -n "$TOKEN" ] || { echo "no-token"; return; }
            curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" -H "Accept: $ACCEPT" \
              "https://ghcr.io/v2/${IMAGE}/manifests/${IMAGE_TAG}"
          }

          sleep 5  # let the registry index the new tag
          ANON=no
          for i in 1 2 3 4 5 6; do
            CODE=$(pull_code anon)
            if [ "$CODE" = "200" ]; then ANON=yes; break; fi
            echo "anonymous check attempt ${i}/6: HTTP ${CODE}"
            sleep 10
          done

          if [ "$ANON" = "yes" ]; then
            echo "verified: ghcr.io/${IMAGE}:${IMAGE_TAG} anonymously pullable (HTTP 200) — what cluster nodes see"
            exit 0
          fi

          CODE=$(pull_code auth)
          if [ "$CODE" = "200" ]; then
            MSG="Tag ${IMAGE_TAG} is pushed and servable (authenticated HTTP 200), but anonymous verification was blocked from the runner (GHCR restricts anonymous /token from runner IPs). If '${IMAGE}' is a NEW package name, flip it public once: https://github.com/users/delta-whiplash/packages/container/synology-csi/settings — later tags inherit the package visibility."
            echo "::warning::${MSG}"
            echo "**Visibility not proven anonymous** — ${MSG}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::tag ${IMAGE_TAG} not servable even authenticated (HTTP ${CODE}) — the push step failed; check its logs."
          exit 1
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

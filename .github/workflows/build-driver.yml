name: Build driver image

# Builds UNMODIFIED upstream synology-csi source with images/Dockerfile.alpine
# and publishes to ghcr.io/<owner>/synology-csi. Exists because Synology
# released driver v1.4.0 without publishing an image (their v1.4.0 Dockerfile
# requires RHEL entitlement). No source patches are applied.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream SynologyOpenSource/synology-csi git ref (tag)"
        required: true
        default: v1.4.0

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate upstream_ref
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          if ! echo "$UPSTREAM_REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::upstream_ref must match v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "UPSTREAM_REF_VALIDATED=$UPSTREAM_REF" >> "$GITHUB_ENV"

      - name: Checkout upstream source at ${{ env.UPSTREAM_REF_VALIDATED }}
        uses: actions/checkout@v4
        with:
          repository: SynologyOpenSource/synology-csi
          ref: ${{ env.UPSTREAM_REF_VALIDATED }}
          path: upstream

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: upstream
          file: images/Dockerfile.alpine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/synology-csi:${{ env.UPSTREAM_REF_VALIDATED }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Make the package public
        run: |
          # New GHCR packages default to private; a CSI driver image is
          # useless to cluster nodes if they cannot pull it anonymously.
          for i in $(seq 1 10); do
            if gh api --method PATCH \
                "user/packages/container/synology-csi" \
                -f visibility=public 2>/dev/null; then
              echo "package set to public"; break
            fi
            sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

{{- if .Values.clientInfoSecret.create }}
{{- if not .Values.clientInfoSecret.clients }}
{{- fail "clientInfoSecret.create=true requires clientInfoSecret.clients (or set create=false and bring your own Secret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synology-csi-ng.fullname" . }}-client-info
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "synology-csi-ng.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-info.yml: |
    clients:
    {{- range .Values.clientInfoSecret.clients }}
      - host: {{ required "clientInfoSecret.clients[].host is required" .host | quote }}
        port: {{ .port | default 5000 }}
        https: {{ .https | default false }}
        username: {{ required "clientInfoSecret.clients[].username is required" .username | quote }}
        password: {{ required "clientInfoSecret.clients[].password is required" .password | quote }}
        {{- with .tlsCACert }}
        tlsCACert: |
          {{- . | nindent 10 }}
        {{- end }}
        {{- with .tlsServerName }}
        tlsServerName: {{ . | quote }}
        {{- end }}
        {{- if hasKey . "insecureSkipVerify" }}
        insecureSkipVerify: {{ .insecureSkipVerify }}
        {{- end }}
    {{- end }}
{{- end }}

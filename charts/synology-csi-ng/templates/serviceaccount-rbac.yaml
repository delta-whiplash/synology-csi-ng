apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synology-csi-ng.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "synology-csi-ng.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synology-csi-ng.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "synology-csi-ng.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "synology-csi-ng.fullname" . }}-controller
  labels:
    {{- include "synology-csi-ng.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments", "volumeattachments/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # Required by external-resizer v1.13.1+ for VolumeAttributesClass
  # lookups during PVC expansion (GA in Kubernetes 1.32).
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattributesclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "synology-csi-ng.fullname" . }}-controller
  labels:
    {{- include "synology-csi-ng.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "synology-csi-ng.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "synology-csi-ng.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "synology-csi-ng.fullname" . }}-node
  labels:
    {{- include "synology-csi-ng.labels" . | nindent 4 }}
rules:
  # The node plugin only reads Node objects (identity, topology, readiness).
  # Previous revisions carried stale rules (secrets, namespaces, PVs,
  # volumeattachments) that the driver code never exercises — trimmed to
  # the minimum the container actually needs (audit: chart-1).
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "synology-csi-ng.fullname" . }}-node
  labels:
    {{- include "synology-csi-ng.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "synology-csi-ng.fullname" . }}-node
subjects:
  - kind: ServiceAccount
    name: {{ include "synology-csi-ng.fullname" . }}-node
    namespace: {{ .Release.Namespace }}
{{- if .Values.snapshotter.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "synology-csi-ng.fullname" . }}-snapshotter
  labels:
    {{- include "synology-csi-ng.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "synology-csi-ng.fullname" . }}-snapshotter
  labels:
    {{- include "synology-csi-ng.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "synology-csi-ng.fullname" . }}-snapshotter
subjects:
  - kind: ServiceAccount
    name: {{ include "synology-csi-ng.fullname" . }}-snapshotter
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synology-csi-ng.fullname" . }}-snapshotter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "synology-csi-ng.labels" . | nindent 4 }}
{{- end }}
